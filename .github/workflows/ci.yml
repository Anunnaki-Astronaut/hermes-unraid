name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test backend
        run: python -m pytest -q
      - name: Check Desktop JavaScript
        run: node --check desktop/plugin.js
      - name: Check screenshot renderer
        run: |
          node --check scripts/render_screenshot.cjs
          for tab in overview array docker vms alerts; do
            node --experimental-vm-modules scripts/render_screenshot.cjs "$tab" ".screenshots-preview/$tab.html"
          done
